<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好みオケ KONOMIOKE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="ui/css-base.css">
<link rel="stylesheet" href="ui/css-boot.css">
<link rel="stylesheet" href="ui/css-lobby.css">
<link rel="stylesheet" href="ui/css-stage.css">
<link rel="stylesheet" href="ui/css-modals.css">
<link rel="stylesheet" href="ui/css-chat.css">
<link rel="stylesheet" href="_kcc/css/kcc-base.css">
</head>
<body>
<div id="app"></div>

<script>
// Load HTML templates
async function loadTemplates() {
  const app = document.getElementById('app');
  const templates = ['html-canvas', 'html-boot', 'html-lobby', 'html-stage', 'html-modals'];
  for (const t of templates) {
    const r = await fetch('ui/' + t + '.html');
    app.insertAdjacentHTML('beforeend', await r.text());
  }
}

// Load the full app script (legacy classes inline until fully modularized)
async function boot() {
  await loadTemplates();

  // Load split class files in order
  const scripts = [
    'js/utils.js', 'js/identity.js', 'js/crdt-queue.js', 'js/mesh.js',
    'js/fabric.js', 'js/vocal.js', 'js/tracks.js', 'js/viz.js',
    'js/app.js', 'js/boot.js'
  ];
  for (const src of scripts) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.body.appendChild(s);
    });
  }
}

boot().catch(err => {
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ff2244;font-family:monospace;text-align:center;padding:2rem"><div><h1>好みオケ</h1><p>Load failed: ' + err.message + '</p></div></div>';
});
</script>
</body>
</html>
