<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好みオケ KONOMIOKE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="ui/css-base.css">
<link rel="stylesheet" href="ui/css-boot.css">
<link rel="stylesheet" href="ui/css-lobby.css">
<link rel="stylesheet" href="ui/css-stage.css">
<link rel="stylesheet" href="ui/css-modals.css">
<link rel="stylesheet" href="ui/css-chat.css">
</head>
<body>
<div id="app">Loading...</div>

<script>
// Remote logger — sends console to OnlyBrains API
const _rlog = [];
function rlog(msg) {
  _rlog.push(msg);
  console.log('[KONOMIOKE]', msg);
  fetch('https://onlybrains.onrender.com/api/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'konomioke-debug', message: msg, role: 'system' }),
  }).catch(() => {});
}
window.addEventListener('error', e => rlog('ERR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => rlog('REJECT: ' + (e.reason?.message || e.reason)));

async function boot() {
  rlog('boot start');
  const app = document.getElementById('app');
  const templates = ['html-canvas','html-boot','html-lobby','html-stage','html-modals'];
  app.innerHTML = '';
  for (const t of templates) {
    const r = await fetch('ui/' + t + '.html');
    if (r.ok) app.insertAdjacentHTML('beforeend', await r.text());
  }
  rlog('templates loaded: ' + app.children.length + ' elements');
  const s = document.createElement('script');
  s.src = 'js/bundle.js';
  s.onload = () => rlog('bundle.js loaded');
  s.onerror = (e) => rlog('bundle.js FAILED: ' + e);
  document.body.appendChild(s);
}
boot().catch(e => {
  rlog('boot CATCH: ' + e.message);
  document.getElementById('app').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ff2244;font-family:monospace"><div><h1>好みオケ</h1><p>' + e.message + '</p></div></div>';
});
</script>
</body>
</html>
