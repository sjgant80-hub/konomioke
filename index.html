<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好みオケ KONOMIOKE × MOOSIC</title>
<link rel="stylesheet" href="ui/css-picker.css?v=3">
</head>
<body>
<header class="picker-head">
  <h1>好みオケ <span class="x">×</span> moosic</h1>
  <p class="sub">pick one</p>
</header>

<main class="picker">
  <section class="card card-konomi card-iframe">
    <iframe
      class="konomi-frame"
      src="engine/"
      title="KONOMIOKE engine"
      allow="autoplay *; microphone *; camera *; display-capture *; clipboard-read; clipboard-write; fullscreen *"
      allowfullscreen></iframe>
    <header class="konomi-bar">
      <span class="glyph">好</span>
      <span class="title">KONOMIOKE</span>
      <a class="open" href="engine/" target="_top">open ↗</a>
    </header>
  </section>

  <section class="card card-moosic card-iframe">
    <iframe
      class="moosic-frame"
      src="https://teslasolar.github.io/moosic/grid/"
      title="MOOSIC grid"
      loading="lazy"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"
      allow="autoplay; clipboard-read; clipboard-write; fullscreen"></iframe>
    <header class="moosic-bar">
      <span class="glyph">♪</span>
      <span class="title">MOOSIC</span>
      <a class="open" href="https://teslasolar.github.io/moosic/grid/" target="_top">open ↗</a>
    </header>
  </section>
</main>

<footer class="picker-foot">
  <a href="https://github.com/teslasolar/konomioke" target="_blank" rel="noopener">github / konomioke</a>
  · <a href="https://github.com/teslasolar/moosic" target="_blank" rel="noopener">github / moosic</a>
</footer>

<script>
// Prime mic permission from the top-level origin so the prompt isn't blocked
// inside the engine iframe. Fires once on first user gesture (click/key) on
// the picker page. The granted permission is then inherited by the iframe
// thanks to allow="microphone *".
(function () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  let armed = true;
  const prime = async () => {
    if (!armed) return;
    armed = false;
    window.removeEventListener('pointerdown', prime, true);
    window.removeEventListener('keydown', prime, true);
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      // Release immediately — we just wanted the permission grant.
      s.getTracks().forEach(t => t.stop());
    } catch (e) {
      // user denied or no device — engine will fall back to lobby
    }
  };
  window.addEventListener('pointerdown', prime, true);
  window.addEventListener('keydown', prime, true);
})();
</script>
</body>
</html>
