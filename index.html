<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好みオケ KONOMIOKE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="ui/css-base.css">
<link rel="stylesheet" href="ui/css-boot.css">
<link rel="stylesheet" href="ui/css-lobby.css">
<link rel="stylesheet" href="ui/css-stage.css">
<link rel="stylesheet" href="ui/css-modals.css">
<link rel="stylesheet" href="ui/css-chat.css">
</head>
<body>
<div id="app">Loading...</div>

<script>
function rlog(msg) {
  console.log('[K]', msg);
  fetch('https://onlybrains.onrender.com/api/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'konomioke-debug', message: msg, role: 'system' }),
  }).catch(() => {});
}
window.addEventListener('error', e => rlog('ERR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno));

async function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.body.appendChild(s);
  });
}

async function boot() {
  rlog('boot');
  const app = document.getElementById('app');
  app.innerHTML = '';

  // 1. Load HTML templates
  for (const t of ['html-canvas','html-boot','html-lobby','html-stage','html-modals']) {
    const r = await fetch('ui/' + t + '.html');
    if (r.ok) app.insertAdjacentHTML('beforeend', await r.text());
  }
  rlog('templates:' + app.children.length);

  // 2. Load JS modules individually by phase
  await loadScript('js/globals.js');                   rlog('p0');
  await loadScript('js/p2-identity/identity.js');      rlog('p2');
  await loadScript('js/p11-tracks/crdt-queue.js');     rlog('p11a');
  await loadScript('js/p3-mesh/mesh.js');              rlog('p3');
  await loadScript('js/p5-fabric/fabric.js');          rlog('p5');
  await loadScript('js/p7-vocal/vocal.js');            rlog('p7');
  await loadScript('js/p11-tracks/tracks.js');         rlog('p11b');
  await loadScript('js/p13-viz/viz.js');               rlog('p13');
  await loadScript('js/p17-app/app.js');               rlog('p17');
  await loadScript('js/p17-app/boot.js');              rlog('boot.js');
}

boot().catch(e => {
  rlog('FAIL:' + e.message);
  document.getElementById('app').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ff2244;font-family:monospace"><div><h1>好みオケ</h1><p>' + e.message + '</p></div></div>';
});
</script>
</body>
</html>
