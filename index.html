<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚙ 好みオケ KONOMIOKE × MOOSIC — SCADA</title>
<link rel="stylesheet" href="ui/css-picker.css?v=4">
</head>
<body>
<div class="hdr">
  <span style="color:var(--gd);font-weight:700;font-size:11px">⚙ SCADA</span>
  <span style="color:var(--b)">│</span>
  <span style="color:var(--kon)">好</span>
  <span>KONOMIOKE</span>
  <span style="color:var(--t2)">×</span>
  <span style="color:var(--mus)">♪</span>
  <span>MOOSIC</span>
  <span style="flex:1"></span>
  <span id="kon-status"><span class="dot off"></span> engine</span>
  <span id="mus-status"><span class="dot off"></span> grid</span>
  <span style="color:var(--b)">│</span>
  <a href="stream/" class="btn" style="border-color:var(--kon);color:var(--kon)">📡 stream</a>
  <a href="scada.html" class="btn">⚙ tags</a>
  <span id="clock" style="color:var(--t2)"></span>
</div>

<div class="dock">
  <div class="pane">
    <div class="pane-bar kon">
      <span style="font-family:serif;font-size:11px">好</span>
      <span style="font-weight:600;letter-spacing:.1em">KONOMIOKE</span>
      <span style="flex:1"></span>
      <span class="stat-pill" style="background:rgba(255,45,117,.1);color:var(--kon)" id="kon-state">init</span>
      <a href="engine/" target="_top" class="btn kon">open ↗</a>
      <button id="scada-audio-btn" class="btn kon" style="cursor:pointer;border:1px solid;background:transparent;font-size:10px">⚪ audio</button>
      <a href="scada.html" class="btn kon">scada</a>
    </div>
    <iframe id="frame-kon" src="engine/"
      allow="autoplay *; microphone *; camera *; display-capture *; clipboard-read; clipboard-write; fullscreen *"
      allowfullscreen></iframe>
  </div>

  <div class="pane">
    <div class="pane-bar mus">
      <span style="font-size:11px">♪</span>
      <span style="font-weight:600;letter-spacing:.1em">MOOSIC</span>
      <span style="flex:1"></span>
      <span class="stat-pill" style="background:rgba(45,212,255,.1);color:var(--mus)" id="mus-tags">—</span>
      <a href="https://teslasolar.github.io/moosic/grid/" target="_top" class="btn mus">open ↗</a>
      <a href="https://teslasolar.github.io/moosic/scada.html" class="btn mus">scada</a>
    </div>
    <iframe id="frame-mus" src="https://teslasolar.github.io/moosic/grid/"
      loading="lazy" referrerpolicy="no-referrer"
      allow="autoplay *; microphone *; camera *; display-capture *; clipboard-read; clipboard-write; fullscreen *"></iframe>
  </div>
</div>

<div class="ftr">
  <span style="color:var(--gd)">🏷</span>
  <span>tag.db</span>
  <span style="color:var(--b)">│</span>
  <span id="ftr-kon">konomioke: —</span>
  <span style="color:var(--b)">│</span>
  <span id="ftr-mus">moosic: —</span>
  <span style="flex:1"></span>
  <a href="https://github.com/teslasolar/konomioke" target="_blank" class="btn">gh/konomioke</a>
  <a href="https://github.com/teslasolar/moosic" target="_blank" class="btn">gh/moosic</a>
</div>

<script src="p2p/identity.js"></script>
<script src="p2p/mesh.js"></script>
<script src="p2p/poll-signal.js"></script>
<script src="js/state-widget.js"></script>
<script>
stateWidgetInit(
  'stateDiagram-v2\n[*]-->load\nload-->fetchTags : count tags\nfetchTags-->ready : both repos\nready-->kon_active : engine boots\nkon_active-->mus_active : grid loads\nmus_active-->live : both iframes live',
  'load'
);
</script>
<script src="js/scada-dash.js"></script>
</body>
</html>
