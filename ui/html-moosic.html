<!-- Moosic embed — live iframe of teslasolar/moosic GitHub Pages -->
<div id="moosic-panel" class="moosic-panel" hidden>
  <header class="moosic-bar">
    <span class="moosic-title">MOOSIC</span>
    <span class="moosic-sub">teslasolar/moosic · live</span>
    <span class="moosic-spacer"></span>
    <a class="moosic-open" href="https://teslasolar.github.io/moosic/" target="_blank" rel="noopener">open ↗</a>
    <button class="moosic-close" type="button" data-moosic-close aria-label="Close">×</button>
  </header>
  <iframe
    class="moosic-frame"
    src="https://teslasolar.github.io/moosic/"
    title="moosic"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    allow="autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-presentation"
  ></iframe>
</div>

<button id="moosic-launch" class="moosic-launch" type="button" data-moosic-open title="Open Moosic">♪ moosic</button>
