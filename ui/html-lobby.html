<div id="lobby-screen">
  <div class="lobby-card">
    <h2>好みオケ</h2>
    <p style="font-size:0.75rem;color:var(--text-dim);">Peer-to-Peer Therapeutic Karaoke</p>

    <div class="lobby-identity">
      <div class="identity-label">YOUR IDENTITY</div>
      <div class="identity-id" id="lobby-pubkey">—</div>
      <div class="identity-name-row">
        <input id="display-name" placeholder="Display name" maxlength="24" />
        <button id="save-name">SET</button>
      </div>
    </div>

    <div class="lobby-actions">
      <button class="primary" id="btn-create-room">CREATE ROOM</button>
      <div class="lobby-join">
        <input id="join-code" placeholder="ROOM CODE" maxlength="16" />
        <button id="btn-join-room">JOIN</button>
      </div>
    </div>

    <div class="lobby-signal">
      <label>Signal:</label>
      <input id="signal-url" value="" placeholder="ws://your-server:3000" />
    </div>
    <p style="font-size:0.55rem;color:var(--text-dim);margin-top:0.6rem;line-height:1.4">
      Leave signal blank to sing solo. For P2P rooms, run<br>
      <code style="color:var(--r4)">npm start</code> and enter your signaling server URL.
    </p>
  </div>
</div>
