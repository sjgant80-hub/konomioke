<div id="boot-screen">
  <div class="boot-title">好みオケ</div>
  <div class="boot-sub">KONOMIOKE</div>
  <div class="boot-phases">
    <div class="boot-phase" data-phase="2">
      <span class="phase-prime">p=2</span>
      <span class="phase-dot"></span>
      <span class="phase-label">IDENTITY + ROOMS</span>
      <span class="phase-status"></span>
    </div>
    <div class="boot-phase" data-phase="3">
      <span class="phase-prime">p=3</span>
      <span class="phase-dot"></span>
      <span class="phase-label">P2P MESH</span>
      <span class="phase-status"></span>
    </div>
    <div class="boot-phase" data-phase="5">
      <span class="phase-prime">p=5</span>
      <span class="phase-dot"></span>
      <span class="phase-label">AUDIO FABRIC</span>
      <span class="phase-status"></span>
    </div>
    <div class="boot-phase" data-phase="7">
      <span class="phase-prime">p=7</span>
      <span class="phase-dot"></span>
      <span class="phase-label">VOCAL PROCESSING</span>
      <span class="phase-status"></span>
    </div>
    <div class="boot-phase" data-phase="11">
      <span class="phase-prime">p=11</span>
      <span class="phase-dot"></span>
      <span class="phase-label">TRACK + LYRICS</span>
      <span class="phase-status"></span>
    </div>
    <div class="boot-phase" data-phase="13">
      <span class="phase-prime">p=13</span>
      <span class="phase-dot"></span>
      <span class="phase-label">VISUALIZATION</span>
      <span class="phase-status"></span>
    </div>
    <div class="boot-phase" data-phase="17">
      <span class="phase-prime">p=17</span>
      <span class="phase-dot"></span>
      <span class="phase-label">LAUNCHER</span>
      <span class="phase-status"></span>
    </div>
  </div>
  <div class="boot-fold">fold(konomioke) = 2 &times; 3 &times; 5 &times; 7 &times; 11 &times; 13 &times; 17 = 510,510</div>
</div>
