<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgr" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e0a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="micg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ff2d75"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="waveglow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgr)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#ff2d75" stroke-width="2" opacity="0.25"/>
  <!-- Inner accent ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#00aaff" stroke-width="1" opacity="0.12"/>

  <!-- ── Sound waves LEFT ── -->
  <!-- outer-outer -->
  <path d="M 118,138 A 132,132 0 0,0 118,314"
        fill="none" stroke="#00aaff" stroke-width="4" stroke-linecap="round"
        opacity="0.30" filter="url(#waveglow)"/>
  <!-- outer -->
  <path d="M 148,158 A 98,98 0 0,0 148,294"
        fill="none" stroke="#00aaff" stroke-width="5" stroke-linecap="round"
        opacity="0.55" filter="url(#waveglow)"/>
  <!-- inner -->
  <path d="M 182,176 A 62,62 0 0,0 182,276"
        fill="none" stroke="#00aaff" stroke-width="6" stroke-linecap="round"
        opacity="0.85" filter="url(#waveglow)"/>

  <!-- ── Sound waves RIGHT ── -->
  <path d="M 394,138 A 132,132 0 0,1 394,314"
        fill="none" stroke="#00aaff" stroke-width="4" stroke-linecap="round"
        opacity="0.30" filter="url(#waveglow)"/>
  <path d="M 364,158 A 98,98 0 0,1 364,294"
        fill="none" stroke="#00aaff" stroke-width="5" stroke-linecap="round"
        opacity="0.55" filter="url(#waveglow)"/>
  <path d="M 330,176 A 62,62 0 0,1 330,276"
        fill="none" stroke="#00aaff" stroke-width="6" stroke-linecap="round"
        opacity="0.85" filter="url(#waveglow)"/>

  <!-- ── 好 watermark ── -->
  <text x="256" y="296" text-anchor="middle" dominant-baseline="middle"
        font-family="serif" font-size="180" fill="#ff2d75" opacity="0.07"
        font-weight="bold">好</text>

  <!-- ── Mic body (capsule) with glow ── -->
  <rect x="211" y="138" width="90" height="152" rx="45"
        fill="#1a0010" opacity="0.6"/>
  <rect x="211" y="138" width="90" height="152" rx="45"
        fill="url(#micg)" filter="url(#glow)"/>

  <!-- Mic grille lines (horizontal) -->
  <line x1="222" y1="168" x2="290" y2="168" stroke="#fff" stroke-width="2" opacity="0.18"/>
  <line x1="218" y1="188" x2="294" y2="188" stroke="#fff" stroke-width="2" opacity="0.18"/>
  <line x1="215" y1="208" x2="297" y2="208" stroke="#fff" stroke-width="2" opacity="0.18"/>
  <line x1="215" y1="228" x2="297" y2="228" stroke="#fff" stroke-width="2" opacity="0.18"/>
  <line x1="217" y1="248" x2="295" y2="248" stroke="#fff" stroke-width="2" opacity="0.18"/>
  <line x1="222" y1="268" x2="290" y2="268" stroke="#fff" stroke-width="2" opacity="0.18"/>

  <!-- Mic highlight left edge -->
  <rect x="211" y="138" width="8" height="152" rx="4"
        fill="url(#micg)" opacity="0.35"/>

  <!-- ── Mic stand ── -->
  <!-- Vertical stem -->
  <line x1="256" y1="290" x2="256" y2="358"
        stroke="#ff6b9d" stroke-width="8" stroke-linecap="round"/>
  <!-- Base arc -->
  <path d="M 210,358 Q 210,396 256,396 Q 302,396 302,358"
        fill="none" stroke="#ff6b9d" stroke-width="8" stroke-linecap="round"/>
  <!-- Base foot -->
  <line x1="216" y1="394" x2="296" y2="394"
        stroke="#ff6b9d" stroke-width="6" stroke-linecap="round"/>

  <!-- Mic bottom cap accent dot -->
  <circle cx="256" cy="388" r="5" fill="#ff2d75" opacity="0.6"/>
</svg>
