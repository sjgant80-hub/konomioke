<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0a28"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="glow_center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d75" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff2d75" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Ambient bloom behind icon -->
  <ellipse cx="540" cy="780" rx="420" ry="300"
           fill="url(#glow_center)"/>

  <!-- ── Decorative grid lines (subtle) ── -->
  <g opacity="0.05" stroke="#00aaff" stroke-width="1">
    <!-- Horizontal grid -->
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="640" x2="1080" y2="640"/>
    <line x1="0" y1="800" x2="1080" y2="800"/>
    <line x1="0" y1="960" x2="1080" y2="960"/>
    <line x1="0" y1="1120" x2="1080" y2="1120"/>
    <!-- Vertical grid -->
    <line x1="270" y1="0" x2="270" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="810" y1="0" x2="810" y2="1920"/>
  </g>

  <!-- ── Corner accent dots ── -->
  <circle cx="40" cy="40" r="3" fill="#ff2d75" opacity="0.4"/>
  <circle cx="1040" cy="40" r="3" fill="#ff2d75" opacity="0.4"/>
  <circle cx="40" cy="1880" r="3" fill="#ff2d75" opacity="0.4"/>
  <circle cx="1040" cy="1880" r="3" fill="#ff2d75" opacity="0.4"/>

  <!-- ── Waveform bars (bottom decoration) ── -->
  <g opacity="0.35" fill="#00aaff">
    <rect x="60"  y="1680" width="18" height="40"  rx="4"/>
    <rect x="90"  y="1665" width="18" height="55"  rx="4"/>
    <rect x="120" y="1650" width="18" height="70"  rx="4"/>
    <rect x="150" y="1640" width="18" height="80"  rx="4"/>
    <rect x="180" y="1630" width="18" height="90"  rx="4"/>
    <rect x="210" y="1645" width="18" height="75"  rx="4"/>
    <rect x="240" y="1655" width="18" height="65"  rx="4"/>
    <rect x="270" y="1668" width="18" height="52"  rx="4"/>
    <rect x="300" y="1675" width="18" height="45"  rx="4"/>
    <rect x="330" y="1660" width="18" height="60"  rx="4"/>
    <rect x="360" y="1648" width="18" height="72"  rx="4"/>
    <rect x="390" y="1638" width="18" height="82"  rx="4"/>
    <rect x="420" y="1628" width="18" height="92"  rx="4"/>
    <rect x="450" y="1618" width="18" height="102" rx="4"/>
    <rect x="480" y="1608" width="18" height="112" rx="4"/>
    <rect x="510" y="1598" width="18" height="122" rx="4"/>
    <rect x="540" y="1588" width="18" height="132" rx="4"/>
    <rect x="570" y="1598" width="18" height="122" rx="4"/>
    <rect x="600" y="1608" width="18" height="112" rx="4"/>
    <rect x="630" y="1618" width="18" height="102" rx="4"/>
    <rect x="660" y="1628" width="18" height="92"  rx="4"/>
    <rect x="690" y="1638" width="18" height="82"  rx="4"/>
    <rect x="720" y="1648" width="18" height="72"  rx="4"/>
    <rect x="750" y="1658" width="18" height="62"  rx="4"/>
    <rect x="780" y="1668" width="18" height="52"  rx="4"/>
    <rect x="810" y="1675" width="18" height="45"  rx="4"/>
    <rect x="840" y="1660" width="18" height="60"  rx="4"/>
    <rect x="870" y="1648" width="18" height="72"  rx="4"/>
    <rect x="900" y="1638" width="18" height="82"  rx="4"/>
    <rect x="930" y="1650" width="18" height="70"  rx="4"/>
    <rect x="960" y="1663" width="18" height="57"  rx="4"/>
    <rect x="990" y="1675" width="18" height="45"  rx="4"/>
    <rect x="1002" y="1682" width="18" height="38" rx="4"/>
  </g>

  <!-- ── Sound waves (large, centered) ── -->
  <!-- Left waves -->
  <path d="M 240,600 A 310,310 0 0,0 240,960"
        fill="none" stroke="#00aaff" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
  <path d="M 300,640 A 240,240 0 0,0 300,920"
        fill="none" stroke="#00aaff" stroke-width="5.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 370,676 A 162,162 0 0,0 370,884"
        fill="none" stroke="#00aaff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>

  <!-- Right waves -->
  <path d="M 840,600 A 310,310 0 0,1 840,960"
        fill="none" stroke="#00aaff" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
  <path d="M 780,640 A 240,240 0 0,1 780,920"
        fill="none" stroke="#00aaff" stroke-width="5.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 710,676 A 162,162 0 0,1 710,884"
        fill="none" stroke="#00aaff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>

  <!-- ── Main mic icon ── -->
  <!-- Mic glow bloom -->
  <rect x="440" y="570" width="200" height="300" rx="100" fill="#ff2d75" filter="url(#softglow)" opacity="0.5"/>

  <!-- Mic shadow/depth -->
  <rect x="438" y="573" width="200" height="300" rx="100" fill="#1a0010" opacity="0.7"/>

  <!-- Mic body -->
  <rect x="440" y="574" width="200" height="298" rx="99"
        fill="#ff2d75"/>
  <!-- Mic body lighter top highlight -->
  <rect x="440" y="574" width="200" height="148" rx="99"
        fill="#ff6b9d" opacity="0.35"/>

  <!-- Mic grille lines -->
  <line x1="464" y1="625" x2="616" y2="625" stroke="#fff" stroke-width="2.5" opacity="0.2"/>
  <line x1="456" y1="655" x2="624" y2="655" stroke="#fff" stroke-width="2.5" opacity="0.2"/>
  <line x1="452" y1="685" x2="628" y2="685" stroke="#fff" stroke-width="2.5" opacity="0.2"/>
  <line x1="450" y1="715" x2="630" y2="715" stroke="#fff" stroke-width="2.5" opacity="0.2"/>
  <line x1="450" y1="745" x2="630" y2="745" stroke="#fff" stroke-width="2.5" opacity="0.2"/>
  <line x1="452" y1="775" x2="628" y2="775" stroke="#fff" stroke-width="2.5" opacity="0.2"/>
  <line x1="456" y1="805" x2="624" y2="805" stroke="#fff" stroke-width="2.5" opacity="0.2"/>
  <line x1="464" y1="835" x2="616" y2="835" stroke="#fff" stroke-width="2.5" opacity="0.2"/>

  <!-- Mic vertical stem -->
  <line x1="540" y1="872" x2="540" y2="960"
        stroke="#ff6b9d" stroke-width="14" stroke-linecap="round"/>
  <!-- Mic base arc -->
  <path d="M 460,960 Q 460,1020 540,1020 Q 620,1020 620,960"
        fill="none" stroke="#ff6b9d" stroke-width="14" stroke-linecap="round"/>
  <!-- Mic base foot bar -->
  <line x1="468" y1="1018" x2="612" y2="1018"
        stroke="#ff6b9d" stroke-width="10" stroke-linecap="round"/>

  <!-- ── 好 kanji (large centered watermark) ── -->
  <text x="540" y="840" text-anchor="middle" dominant-baseline="middle"
        font-family="serif" font-size="360" fill="#ff2d75" opacity="0.06"
        font-weight="bold">好</text>

  <!-- ── Wordmark ── -->
  <!-- 好みオケ -->
  <text x="540" y="1110" text-anchor="middle" dominant-baseline="middle"
        font-family="serif" font-size="72" fill="#e8e8f0" opacity="0.9"
        letter-spacing="8">好みオケ</text>

  <!-- KONOMIOKE -->
  <text x="540" y="1180" text-anchor="middle" dominant-baseline="middle"
        font-family="monospace" font-size="64" fill="#ff2d75" opacity="0.95"
        font-weight="700" letter-spacing="14">KONOMIOKE</text>

  <!-- Tagline -->
  <text x="540" y="1240" text-anchor="middle" dominant-baseline="middle"
        font-family="monospace" font-size="28" fill="#00aaff" opacity="0.7"
        letter-spacing="6">PEER · TO · PEER · KARAOKE</text>

  <!-- Divider line under wordmark -->
  <line x1="340" y1="1268" x2="740" y2="1268"
        stroke="#ff2d75" stroke-width="1" opacity="0.3"/>
</svg>
