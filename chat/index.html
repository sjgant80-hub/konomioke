<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💬 KONOMI CHAT — Ki Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div id="score">0</div><div id="charge-type"></div></div>
  <div style="text-align:right">
    <input id="nick" value="" placeholder="nickname" style="background:transparent;border:1px solid #333;color:#0f0;padding:2px 6px;font-size:10px;font-family:inherit;width:90px;border-radius:3px">
    <div id="room" style="color:#0ff;font-size:10px;margin-top:2px">KONOMI</div>
    <div id="peers" style="color:#088;font-size:10px">👥 1</div>
  </div>
</div>
<div id="phonemes"></div>
<div id="dmgLayer"></div>
<div id="chat">
  <div id="msgs"></div>
  <div id="chat-row">
    <input id="chat-in" placeholder="chat..." maxlength="300" autocomplete="off">
    <button onclick="sendChat()">▶</button>
  </div>
</div>

<script src="error-log.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../p2p/poll-signal.js"></script>
<script src="config.js"></script>
<script src="kanji.js"></script>
<script src="voice.js"></script>
<script src="arena.js"></script>
<script src="charge.js"></script>
<script src="projectile.js"></script>
<script src="vfx.js"></script>
<script src="chat.js"></script>
<script src="sprite.js"></script>
<script src="loop.js"></script>
<script src="../js/state-widget.js"></script>
<script>
(async function(){
  await loadChatConfig();
  // Build phoneme UI from tags
  var c=document.getElementById('phonemes');PH_KEYS.forEach(function(k){var ph=PHONEMES[k],kj=KANJI[k];
    var d=document.createElement('div');d.className='ph';d.id='ph-'+k;
    d.innerHTML='<div class="ph-kanji" style="color:'+ph.color+'">'+kj.char+'</div><div class="ph-label" style="color:'+ph.color+'">'+ph.label+'</div><div class="ph-bar"><div class="ph-fill" style="background:'+ph.color+';height:0%"></div></div>';
    c.appendChild(d)});
  document.getElementById('chat-in').onkeydown=function(e){if(e.key==='Enter'){sendChat();e.stopPropagation()}};
  if(typeof stateWidgetInit==='function')stateWidgetInit(
    'stateDiagram-v2\n[*]-->config\nconfig-->mic : loadChatConfig\nmic-->scene : initAudio\nscene-->spawn : initScene\nspawn-->joined : spawnLocalSprite\njoined-->loop : animate 60Hz\nloop-->charging : voice sounding\ncharging-->fire : release vowel\nfire-->hit : projectile→target\nhit-->loop : score + combo',
    'config');
  pollSignalJoin('KONOMI',CHAT.myId,getNick());
  addMsg(null,'joined KONOMI arena',null,true);
  if(typeof highlightState==='function')highlightState('joined');
  startArena();
})();
</script>
</body></html>
