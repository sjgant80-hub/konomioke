<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💬 KONOMI CHAT</title>
<style>
:root{--bg:#050810;--c:#0a0d15;--b:#161d2a;--t:#8898b4;--t2:#3a4860;--ig:#38b5f9;--ok:#42e898;--er:#ff4466;--kon:#ff2d75;--gd:#d4a94a}
*{margin:0;box-sizing:border-box;font-family:'Courier New',monospace}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t)}
body{display:flex;flex-direction:column}
.hdr{height:32px;flex-shrink:0;background:var(--c);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 10px;gap:8px;font-size:9px}
.msgs{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;font-size:9px;line-height:1.6}
.msg{padding:2px 0}
.msg .author{font-weight:600;margin-right:4px}
.msg .ts{color:var(--t2);font-size:7px;margin-right:4px}
.sys{color:var(--gd);font-style:italic}
.input-row{height:32px;flex-shrink:0;background:var(--c);border-top:1px solid var(--b);display:flex;align-items:center;padding:0 6px;gap:4px}
.input-row input{flex:1;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:4px 8px;border-radius:3px;font-size:9px;font-family:inherit;outline:none}
.input-row input:focus{border-color:var(--ig)}
.input-row button{background:var(--kon);border:none;color:#fff;padding:4px 10px;border-radius:3px;font-size:9px;cursor:pointer;font-family:inherit}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
#status{color:var(--ok);font-size:8px}
#peers{color:var(--ig)}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:var(--kon);font-weight:700">💬</span>
  <span>KONOMI CHAT</span>
  <span style="color:var(--b)">│</span>
  <span id="room" style="color:var(--gd)">KONOMI</span>
  <span style="color:var(--b)">│</span>
  <span id="peers">👥 1</span>
  <span style="flex:1"></span>
  <span id="status">connecting...</span>
  <span style="color:var(--b)">│</span>
  <input id="nick" value="" placeholder="nickname" style="width:80px;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:2px 4px;border-radius:2px;font-size:8px;font-family:inherit">
</div>

<div class="msgs" id="msgs"></div>

<div class="input-row">
  <input id="chat-in" placeholder="type a message..." maxlength="300" autocomplete="off">
  <button onclick="sendChat()">send</button>
</div>

<script src="../p2p/poll-signal.js"></script>
<script src="chat.js"></script>
</body></html>
