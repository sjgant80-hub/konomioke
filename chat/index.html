<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💬 KONOMI CHAT — Ki Arena</title>
<link rel="stylesheet" href="ui/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div id="score">0</div><div id="charge-type"></div></div>
  <div style="text-align:right">
    <input id="nick" value="" placeholder="nickname" style="background:transparent;border:1px solid #333;color:#0f0;padding:2px 6px;font-size:10px;font-family:inherit;width:90px;border-radius:3px">
    <div id="room" style="color:#0ff;font-size:10px;margin-top:2px">KONOMI</div>
    <div id="peers" style="color:#088;font-size:10px">👥 1</div>
  </div>
</div>
<div id="phonemes"></div>
<div id="dmgLayer"></div>
<div id="chat">
  <div id="chat-tabs">
    <span class="chat-tab active" data-tab="msgs" onclick="switchChatTab('msgs')">MSG</span>
    <span class="chat-tab" data-tab="logs" onclick="switchChatTab('logs')">LOG</span>
    <span class="chat-tab" data-tab="errors" onclick="switchChatTab('errors')">ERR<span id="err-count">0</span></span>
    <span class="chat-tab" data-tab="state" onclick="switchChatTab('state')">SM</span>
  </div>
  <div id="msgs" class="chat-pane" style="display:block"></div>
  <div id="logs" class="chat-pane" style="display:none"></div>
  <div id="errors" class="chat-pane" style="display:none"></div>
  <div id="state" class="chat-pane" style="display:none"></div>
  <div id="chat-row">
    <input id="chat-in" placeholder="chat..." maxlength="300" autocomplete="off">
    <button onclick="sendChat()">▶</button>
  </div>
</div>
<script src="ui/tabs.js"></script>
<!-- log layer -->
<script src="log/trace.js"></script>
<script src="log/error-log.js"></script>
<script src="log/config.js"></script>

<!-- vendor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- signaling -->
<script src="../p2p/poll-signal.js"></script>

<!-- engine modules -->
<script src="engine/kanji.js"></script>
<script src="engine/voice.js"></script>
<script src="engine/arena.js"></script>
<script src="engine/charge.js"></script>
<script src="engine/projectile.js"></script>
<script src="engine/vfx.js"></script>
<script src="engine/sprite.js"></script>
<script src="engine/init.js"></script>

<!-- net + chat -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="net/chat.js"></script>
<script src="net/mqtt.js"></script>
<script src="net/voice.js"></script>
<script src="net/init.js"></script>

<!-- render loop -->
<script src="loop.js"></script>

<!-- state machine -->
<script src="../js/state-widget.js"></script>

<script>
(async function(){
  trace('info','boot start','main');
  traceState('init','config','main');
  await loadChatConfig();
  trace('info','config loaded: '+Object.keys(CFG).join(','),'main');

  // phoneme UI
  var c=document.getElementById('phonemes');PH_KEYS.forEach(function(k){var ph=PHONEMES[k],kj=KANJI[k];
    var d=document.createElement('div');d.className='ph';d.id='ph-'+k;
    d.innerHTML='<div class="ph-kanji" style="color:'+ph.color+'">'+kj.char+'</div><div class="ph-label" style="color:'+ph.color+'">'+ph.label+'</div><div class="ph-bar"><div class="ph-fill" style="background:'+ph.color+';height:0%"></div></div>';
    c.appendChild(d)});

  document.getElementById('chat-in').onkeydown=function(e){if(e.key==='Enter'){sendChat();e.stopPropagation()}};
  document.getElementById('nick').onchange=function(){
    if(POLL_SIG)POLL_SIG.displayName=getNick();
    if(SPRITES.local){scene.remove(SPRITES.local);spawnLocalSprite(CHAT.myId,getNick())}
    trace('info','nick changed: '+getNick(),'main')};

  if(typeof stateWidgetInit==='function')stateWidgetInit(
    'stateDiagram-v2\n[*]-->init\ninit-->config : loadChatConfig\nconfig-->scene : initEngine\nscene-->spawn : spawnLocalSprite\nspawn-->loop : animate 60Hz\nloop-->joining : pollSignalJoin\njoining-->connected : BroadcastChannel\nconnected-->live : mic acquired\nlive-->charging : voice sounding\ncharging-->fire : release vowel\nfire-->hit : projectile\nhit-->live : score++',
    'init');

  traceState('config','engine','main');
  initEngine();
  traceState('engine','net','main');
  initNet();
  trace('info','boot complete','main');
  window.addEventListener('beforeunload',function(){
    if(typeof pollSignalLeave==='function')pollSignalLeave();
    if(typeof mqttDisconnect==='function')mqttDisconnect()});
})();
</script>
</body></html>
