<div id="chat">
  <div id="chat-tabs">
    <span class="chat-tab active" data-tab="msgs" onclick="switchChatTab('msgs')">MSG</span>
    <span class="chat-tab" data-tab="llm-pane" onclick="switchChatTab('llm-pane')">🧠</span>
    <span class="chat-tab" data-tab="logs" onclick="switchChatTab('logs')">LOG</span>
    <span class="chat-tab" data-tab="errors" onclick="switchChatTab('errors')">ERR<span id="err-count">0</span></span>
    <span class="chat-tab" data-tab="state" onclick="switchChatTab('state')">SM</span>
  </div>
  <div id="msgs" class="chat-pane" style="display:block"></div>
  <div id="llm-pane" class="chat-pane" style="display:none">
    <div id="llm-controls">
      <select id="llm-model" onchange="if(typeof LLM!=='undefined')LLM.model=this.value">
        <option value="SmolLM2-1.7B-Instruct-q4f16_1-MLC">SmolLM2 1.7B</option>
        <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi 3.5</option>
        <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 1.5B</option>
        <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 1B</option>
      </select>
      <select id="llm-lang" onchange="if(typeof LLM!=='undefined')LLM.lang=this.value">
        <option value="English">EN</option>
        <option value="Japanese">JP</option>
        <option value="Spanish">ES</option>
        <option value="French">FR</option>
      </select>
      <span id="llm-status">off</span>
    </div>
    <div id="llm-chat"></div>
    <div id="llm-input-row">
      <input id="llm-in" placeholder="ask LLM..." maxlength="300" autocomplete="off">
      <button onclick="askLLM()">▶</button>
    </div>
  </div>
  <div id="logs" class="chat-pane" style="display:none"></div>
  <div id="errors" class="chat-pane" style="display:none"></div>
  <div id="state" class="chat-pane" style="display:none"></div>
  <div id="chat-row">
    <button id="stt-btn" onclick="toggleSTT()" style="background:transparent;border:1px solid #333;color:#333;padding:3px 6px;font-size:10px;cursor:pointer;border-radius:3px">🎙</button>
    <input id="chat-in" placeholder="chat or speak..." maxlength="300" autocomplete="off">
    <button onclick="sendChat()">▶</button>
  </div>
</div>
