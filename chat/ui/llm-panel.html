<div id="llm-panel">
  <div id="llm-header">
    <span class="llm-title">🧠 LLM</span>
    <span id="llm-status">off</span>
    <select id="llm-model">
      <option value="SmolLM2-1.7B-Instruct-q4f16_1-MLC">SmolLM2 1.7B</option>
      <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi 3.5</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 1.5B</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 1B</option>
    </select>
    <div id="bot-toggle" onclick="toggleBot()">OFF</div>
  </div>
  <div id="llm-voice">
    <span>voice</span>
    <label>f0<input id="v-f0" type="range" min="80" max="400" value="185" oninput="FSYNTH.f0=+this.value"></label>
    <label>spd<input id="v-speed" type="range" min="30" max="120" value="80" oninput="FSYNTH.speed=+this.value"></label>
    <label>warm<input id="v-warm" type="range" min="0" max="100" value="60" oninput="FSYNTH.warmth=this.value/100"></label>
  </div>
  <div id="llm-chat"></div>
  <div class="llm-input-row">
    <input id="llm-in" placeholder="ask the LLM..." maxlength="300" autocomplete="off">
    <button onclick="askLLM()">▶</button>
  </div>
</div>
