<div id="sidebar">
  <div id="yt-panel">
    <div class="sb-head">YT</div>
    <div id="yt-embed" style="background:#000;aspect-ratio:16/9;border-radius:4px;overflow:hidden"></div>
    <div id="yt-controls" style="display:flex;gap:3px;margin-top:3px">
      <input id="yt-url" placeholder="youtube url or search..." style="flex:1;background:#111;border:1px solid #222;color:#aaa;padding:3px 6px;font-size:7px;border-radius:3px;font-family:inherit">
      <button onclick="ytLoad()" style="background:#ff2d75;border:none;color:#fff;padding:3px 6px;font-size:7px;border-radius:3px;cursor:pointer">▶</button>
    </div>
  </div>
  <div id="scoreboard">
    <div class="sb-head">SCORE</div>
    <div id="score-rows"></div>
  </div>
  <div id="room-info">
    <div class="sb-head">ROOM</div>
    <div id="room-peers-list" style="font-size:7px;color:#555"></div>
  </div>
</div>
