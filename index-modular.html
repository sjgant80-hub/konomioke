<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好みオケ · Konomioke</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="_kcc/css/kcc-base.css">
<link rel="stylesheet" href="ui/css-base.css">
<link rel="stylesheet" href="ui/css-boot.css">
<link rel="stylesheet" href="ui/css-lobby.css">
<link rel="stylesheet" href="ui/css-stage.css">
<link rel="stylesheet" href="ui/css-modals.css">
<link rel="stylesheet" href="ui/css-chat.css">
</head>
<body>
<div id="app"></div>

<script type="module">
// Load HTML templates into #app
const app = document.getElementById('app');
const templates = ['html-canvas','html-boot','html-lobby','html-stage','html-modals'];
for (const t of templates) {
  const r = await fetch(`ui/${t}.html`);
  app.insertAdjacentHTML('beforeend', await r.text());
}

// Shared utilities
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function bufToHex(buf) { return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''); }
function hexToBuf(hex) { const b = new Uint8Array(hex.length/2); for(let i=0;i<hex.length;i+=2) b[i/2]=parseInt(hex.substr(i,2),16); return b.buffer; }
function shortId(hex) { return hex.slice(0,8)+hex.slice(-6); }
function peerColor(pk) { let h=0; for(let i=0;i<8;i++) h=(h*31+pk.charCodeAt(i))&0xffffff; return `hsl(${h%360},70%,60%)`; }
function formatTime(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

const RING_COLORS = ['#ff3366','#ff8833','#ffcc33','#33cccc','#3366ff','#9933ff','#ff33cc'];
const RING_NAMES = ['Diaphragm','Larynx','Breath','Thoracic','Nasal','Oral','Observer'];
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const PRIMES = [2,3,5,7,11,13,17];

// Load phase classes from extracted modules
// (phases/ contains the extracted classes — import them here when ready)
// For now, fall back to loading the original monolith's script section

// Boot KCC mining overlay
import('./_kcc/js/kcc-mine.js').then(kcc => {
  kcc.initMiningWidget();
  setInterval(() => {
    if (window._konomi?.fabric) kcc.tickMining(window._konomi.fabric);
  }, 200);
}).catch(() => {});
</script>

<!-- Original monolith classes (until fully modularized) -->
<script src="phases/p2-identity.js" defer></script>
</body>
</html>
